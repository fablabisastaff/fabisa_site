site_name: Fab Lab Ísafjörður
site_description: >-
  Make almost anything with us and get expert support to bring creative ideas to life in the Westfjords. visit us to innovate and collaborate!
site_url: https://www.fabisa.is/

# Drafts ending in .mdd are kept in the repo but not published
exclude_docs: |
  *.mdd

theme:
  name: material
  variant: modern
  custom_dir: overrides
  language: is
  logo: assets/img/logo/fabisa_logo.png
  favicon: assets/img/favicon.png
  font:
    text: Open Sans
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.top
    - search.highlight
    - content.tabs.link
    - content.code.copy
  # Light and dark mode. The first visit follows the visitor's system
  # setting; the lightbulb button in the header switches manually.
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/lightbulb
        name: Skipta í dökkt útlit
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/lightbulb-outline
        name: Skipta í ljóst útlit

plugins:
  - search
  # Navigation is generated from the folders. A .nav.yml file in a folder
  # can set the order and titles for that folder (see docs/.nav.yml).
  - awesome-nav

extra:
  generator: false

  # Course material: these sections also get a contents list (on pages with
  # 3 or more sections) and previous/next links between pages.
  # Any page can show or hide the contents list with `toc: true` or `toc: false`.
  course_sections:
    - Námsefni

  # Shown in the footer on every page
  contact:
    address: Torfnes, 400 Ísafjörður
    location_note: Í húsnæði Menntaskólans á Ísafirði
    email: info hjá fabisa.is
    phone: +354 450 4408
    opening_hours:
      - Þriðjudagar 15–19
      - Fimmtudagar 15–19

  social:
    - icon: fontawesome/brands/instagram
      link: https://www.instagram.com/fablabisa
      name: Instagram
    - icon: fontawesome/brands/facebook
      link: https://www.facebook.com/FabLabIsafjordur
      name: Facebook
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/@FabLabIsa
      name: YouTube
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/company/fablabisa/
      name: LinkedIn
    - icon: fontawesome/brands/github
      link: https://github.com/FabLabIsafjordur
      name: GitHub

extra_css:
  - stylesheets/site.css

extra_javascript:
  - javascripts/site.js
  - javascripts/mathjax.js

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:zensical.extensions.emoji.twemoji
      emoji_generator: !!python/name:zensical.extensions.emoji.to_svg
  - pymdownx.arithmatex:
      generic: true

copyright: Fab Lab Ísafjörður
