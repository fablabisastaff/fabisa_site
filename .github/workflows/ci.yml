name: ci

# Builds the site on every push and pull request.
# Only pushes to main are published to www.fabisa.is (the gh-pages branch).
on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt ghp-import==2.1.0
      - run: zensical build --clean

      - name: Publish to gh-pages
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages:refs/remotes/origin/gh-pages
          ghp-import --no-jekyll --push --message "Deploy ${GITHUB_SHA::7}" site
