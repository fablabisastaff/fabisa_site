name: ci

# Builds the site on pushes to main and pull requests.
# Only pushes to main are published to www.fabisa.is (the gh-pages branch).
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Read-only by default.
permissions:
  contents: read

# Prevent overlapping runs for the same branch or pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to publish to gh-pages.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt ghp-import==2.1.0
      - run: zensical build --clean

      - name: Publish to gh-pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages:refs/remotes/origin/gh-pages
          ghp-import --no-jekyll --push --message "Deploy ${GITHUB_SHA::7}" site
